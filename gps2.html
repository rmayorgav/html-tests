<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GPS en Tiempo Real</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            padding: 40px;
            max-width: 600px;
            width: 100%;
        }

        h1 {
            color: #333;
            margin-bottom: 30px;
            text-align: center;
            font-size: 28px;
        }

        .status {
            background: #f0f4ff;
            padding: 15px;
            border-radius: 10px;
            margin-bottom: 25px;
            text-align: center;
            font-weight: 600;
            color: #667eea;
        }

        .status.active {
            background: #e8f5e9;
            color: #27ae60;
        }

        .status.error {
            background: #ffebee;
            color: #c62828;
        }

        .info-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 25px;
        }

        .info-card {
            background: #f8f9fa;
            padding: 20px;
            border-radius: 12px;
            border-left: 4px solid #667eea;
        }

        .info-card.warning {
            border-left-color: #ff9800;
        }

        .info-label {
            font-size: 12px;
            color: #999;
            text-transform: uppercase;
            font-weight: 700;
            margin-bottom: 8px;
            letter-spacing: 0.5px;
        }

        .info-value {
            font-size: 18px;
            color: #333;
            font-weight: 600;
            word-break: break-all;
        }

        .info-value.loading {
            color: #999;
            font-style: italic;
        }

        .full-width {
            grid-column: 1 / -1;
        }

        .button-group {
            display: flex;
            gap: 10px;
            margin-bottom: 25px;
            flex-wrap: wrap;
        }

        button {
            flex: 1;
            padding: 12px 20px;
            border: none;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .btn-start {
            background: #27ae60;
            color: white;
        }

        .btn-start:hover {
            background: #229954;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(39, 174, 96, 0.3);
        }

        .btn-stop {
            background: #c62828;
            color: white;
        }

        .btn-stop:hover {
            background: #ad1457;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(198, 40, 40, 0.3);
        }

        .btn-copy {
            background: #667eea;
            color: white;
            flex: 1;
        }

        .btn-copy:hover {
            background: #5568d3;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.3);
        }

        .map-container {
            border-radius: 12px;
            overflow: hidden;
            margin-bottom: 25px;
            background: #e0e0e0;
            aspect-ratio: 16 / 9;
        }

        .map-container iframe {
            width: 100%;
            height: 100%;
            border: none;
        }

        .timestamp {
            text-align: center;
            color: #999;
            font-size: 12px;
            padding-top: 15px;
            border-top: 1px solid #eee;
        }

        .accuracy-bar {
            background: #eee;
            height: 6px;
            border-radius: 3px;
            margin-top: 8px;
            overflow: hidden;
        }

        .accuracy-fill {
            height: 100%;
            background: linear-gradient(90deg, #c62828, #ff9800, #27ae60);
            width: 100%;
            border-radius: 3px;
        }

        @media (max-width: 600px) {
            .info-grid {
                grid-template-columns: 1fr;
            }

            .container {
                padding: 20px;
            }

            h1 {
                font-size: 22px;
            }

            .button-group {
                flex-direction: column;
            }

            button {
                width: 100%;
            }
        }

        .spinner {
            display: inline-block;
            width: 12px;
            height: 12px;
            border: 2px solid #ddd;
            border-top-color: #667eea;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>📍 GPS en Tiempo Real</h1>

        <div class="status" id="status">
            Pulsa "Iniciar" para obtener tu ubicación
        </div>

        <div class="button-group">
            <button class="btn-start" onclick="iniciarGPS()">Iniciar GPS</button>
            <button class="btn-stop" onclick="detenerGPS()">Detener</button>
            <button class="btn-copy" onclick="copiarCoordenadas()">Copiar Coordenadas</button>
        </div>

        <div class="info-grid">
            <div class="info-card">
                <div class="info-label">Latitud</div>
                <div class="info-value" id="latitud">
                    <span class="spinner"></span> Esperando...
                </div>
            </div>

            <div class="info-card">
                <div class="info-label">Longitud</div>
                <div class="info-value" id="longitud">
                    <span class="spinner"></span> Esperando...
                </div>
            </div>

            <div class="info-card">
                <div class="info-label">Precisión</div>
                <div class="info-value" id="precision">
                    <span class="spinner"></span> Esperando...
                </div>
                <div class="accuracy-bar">
                    <div class="accuracy-fill" id="accuracyFill" style="width: 0%"></div>
                </div>
            </div>

            <div class="info-card">
                <div class="info-label">Altitud</div>
                <div class="info-value" id="altitud">
                    <span class="spinner"></span> N/A
                </div>
            </div>

            <div class="info-card">
                <div class="info-label">Velocidad</div>
                <div class="info-value" id="velocidad">
                    <span class="spinner"></span> N/A
                </div>
            </div>

            <div class="info-card">
                <div class="info-label">Rumbo</div>
                <div class="info-value" id="rumbo">
                    <span class="spinner"></span> N/A
                </div>
            </div>

            <div class="info-card full-width">
                <div class="info-label">Dirección Aproximada</div>
                <div class="info-value" id="direccion">Procesando...</div>
            </div>
        </div>

        <div class="map-container" id="mapContainer" style="display: none;">
            <iframe id="mapa" src="" allowfullscreen="" loading="lazy"></iframe>
        </div>

        <div class="timestamp">
            <div id="timestamp">Esperando datos...</div>
        </div>
    </div>

    <script>
        let watchId = null;
        let ultimasCoordinadas = null;

        function iniciarGPS() {
            const status = document.getElementById('status');
            
            if (!navigator.geolocation) {
                status.textContent = '❌ Geolocalización no disponible en tu navegador';
                status.className = 'status error';
                return;
            }

            status.textContent = '🔍 Obteniendo ubicación...';
            status.className = 'status';
            document.getElementById('mapContainer').style.display = 'none';

            // Opciones para mayor precisión
            const opciones = {
                enableHighAccuracy: true,
                timeout: 10000,
                maximumAge: 0
            };

            watchId = navigator.geolocation.watchPosition(
                (posicion) => procesarPosicion(posicion),
                (error) => procesarError(error),
                opciones
            );
        }

        function procesarPosicion(posicion) {
            const { latitude, longitude, accuracy, altitude, speed, heading } = posicion.coords;
            const timestamp = new Date(posicion.timestamp);

            ultimasCoordinadas = { latitude, longitude };

            // Actualizar valores
            document.getElementById('latitud').textContent = latitude.toFixed(7);
            document.getElementById('longitud').textContent = longitude.toFixed(7);
            document.getElementById('precision').textContent = `±${accuracy.toFixed(1)} m`;
            document.getElementById('altitud').textContent = altitude ? `${altitude.toFixed(1)} m` : 'No disponible';
            document.getElementById('velocidad').textContent = speed !== null ? `${(speed * 3.6).toFixed(1)} km/h` : 'No disponible';
            document.getElementById('rumbo').textContent = heading !== null ? `${heading.toFixed(1)}°` : 'No disponible';

            // Actualizar barra de precisión (menos es mejor)
            const precision_pct = Math.min(100, (accuracy / 50) * 100);
            document.getElementById('accuracyFill').style.width = precision_pct + '%';

            // Obtener dirección aproximada
            obtenerDireccion(latitude, longitude);

            // Actualizar mapa
            actualizarMapa(latitude, longitude);

            // Actualizar timestamp
            document.getElementById('timestamp').textContent = 
                `Última actualización: ${timestamp.toLocaleTimeString('es-ES')}`;

            // Actualizar estado
            const status = document.getElementById('status');
            status.textContent = '✅ GPS activo - Actualizando en tiempo real';
            status.className = 'status active';
        }

        function procesarError(error) {
            const status = document.getElementById('status');
            const messages = {
                1: '❌ Permiso denegado. Activa la geolocalización en tu dispositivo.',
                2: '❌ Posición no disponible. Intenta en una ubicación diferente.',
                3: '❌ Tiempo agotado. Intenta de nuevo.'
            };

            status.textContent = messages[error.code] || '❌ Error desconocido';
            status.className = 'status error';
        }

        function detenerGPS() {
            if (watchId !== null) {
                navigator.geolocation.clearWatch(watchId);
                watchId = null;
                
                const status = document.getElementById('status');
                status.textContent = '⏸️ GPS detenido';
                status.className = 'status';
                
                document.getElementById('mapContainer').style.display = 'none';
            }
        }

        function actualizarMapa(lat, lng) {
            const mapContainer = document.getElementById('mapContainer');
            const mapa = document.getElementById('mapa');
            const zoom = 18;
            
            mapa.src = `https://www.openstreetmap.org/export/embed.html?bbox=${lng-0.01},${lat-0.01},${lng+0.01},${lat+0.01}&layer=mapnik&marker=${lat},${lng}`;
            mapContainer.style.display = 'block';
        }

        function obtenerDireccion(lat, lng) {
            // Usar API inversa de OpenStreetMap (Nominatim)
            fetch(`https://nominatim.openstreetmap.org/reverse?format=json&lat=${lat}&lon=${lng}`)
                .then(response => response.json())
                .then(data => {
                    const direccion = data.address?.road || data.address?.suburb || data.address?.city || 'Ubicación desconocida';
                    document.getElementById('direccion').textContent = direccion;
                })
                .catch(() => {
                    document.getElementById('direccion').textContent = 'No se pudo obtener la dirección';
                });
        }

        function copiarCoordenadas() {
            if (!ultimasCoordinadas) {
                alert('Obtén tu ubicación primero');
                return;
            }

            const texto = `${ultimasCoordinadas.latitude.toFixed(7)}, ${ultimasCoordinadas.longitude.toFixed(7)}`;
            navigator.clipboard.writeText(texto).then(() => {
                alert('✓ Coordenadas copiadas: ' + texto);
            });
        }

        // Iniciar automáticamente (opcional)
        // iniciarGPS();
    </script>
</body>
</html>
